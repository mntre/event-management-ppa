<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner - Year End Party Attendance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .header {
      background: white;
      padding: 30px;
      border-radius: 20px 20px 0 0;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    
    .header h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .header p {
      color: #666;
      font-size: 16px;
    }
    
    .main-content {
      background: white;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    
    .config-section {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.3s;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .info-box {
      background: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
      font-size: 13px;
      color: #0c5460;
    }
    
    button {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }
    
    .btn-success {
      background: #28a745;
      color: white;
    }
    
    .btn-success:hover:not(:disabled) {
      background: #218838;
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    #scanner-section {
      display: none;
    }
    
    #reader {
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
      border: 3px solid #667eea;
    }
    
    .status {
      padding: 20px;
      border-radius: 10px;
      margin: 15px 0;
      text-align: center;
      font-weight: 600;
      display: none;
      animation: slideIn 0.3s;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .status.show {
      display: block;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }
    
    .status.warning {
      background: #fff3cd;
      color: #856404;
      border: 2px solid #ffc107;
    }
    
    .status-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }
    
    .status h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    .status p {
      font-size: 16px;
      margin: 5px 0;
    }
    
    .employee-info {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: left;
    }
    
    .employee-info strong {
      color: #667eea;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .stat-label {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .footer {
      background: white;
      padding: 20px;
      border-radius: 0 0 20px 20px;
      text-align: center;
      color: #666;
      font-size: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    
    @media (max-width: 600px) {
      .header h1 {
        font-size: 22px;
      }
      
      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📱 QR Code Scanner</h1>
      <p>Year-End Party 2026 - Attendance System</p>
    </div>
    
    <div class="main-content">
      <!-- Configuration Section -->
      <div id="config-section">
        <div class="config-section">
          <h2 style="margin-bottom: 15px; color: #667eea;">⚙️ Configuration</h2>
          
          <div class="info-box">
            <strong>📝 Setup Instructions:</strong> Enter your Google Sheet ID and the API URL from your deployed Apps Script.
          </div>
          
          <div class="form-group">
            <label>Apps Script API URL:</label>
            <input 
              type="text" 
              id="apiUrl" 
              placeholder="https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"
            >
          </div>
          
          <div class="form-group">
            <label>Google Sheet ID:</label>
            <input 
              type="text" 
              id="sheetId" 
              placeholder="10DHiosqcWvFn5Cz6j4IkQzkNcdqBzTZF5NZdWVQVGzg"
              value="10DHiosqcWvFn5Cz6j4IkQzkNcdqBzTZF5NZdWVQVGzg"
            >
          </div>
          
          <div class="form-group">
            <label>Attendance Tab Name:</label>
            <input 
              type="text" 
              id="attendanceTab" 
              placeholder="Attendance"
              value="Attendance"
            >
          </div>
          
          <button class="btn-success" onclick="startScanner()">
            🎥 Start Scanner
          </button>
        </div>
      </div>
      
      <!-- Scanner Section -->
      <div id="scanner-section">
        <div class="stats">
          <div class="stat-card">
            <div class="stat-value" id="totalScans">0</div>
            <div class="stat-label">Total Scans</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="successScans">0</div>
            <div class="stat-label">Successful</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="duplicateScans">0</div>
            <div class="stat-label">Duplicates</div>
          </div>
        </div>
        
        <div id="reader"></div>
        
        <div id="status" class="status"></div>
        
        <button class="btn-success" onclick="location.reload()" style="margin-top: 20px;">
          🔄 Reset Scanner
        </button>
      </div>
    </div>
    
    <div class="footer">
      <p>Year-End Party 2026 Attendance System</p>
      <p>Scan QR codes to mark employee attendance</p>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="scanner.js"></script>
</body>
</html>
